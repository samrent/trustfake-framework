name: clip_vit_b16_probe
model:
  _target_: trustfake.models.torch.clip_probe
  num_classes: 3
  model_name: ViT-B-16
  pretrained: laion2b_s34b_b88k
  freeze_backbone: true
  normalize_features: true

# Standard ViT-B/16. The CONTROL for the patch-size axis: E is 768x768,
# square, so the rank bound that discards 3/4 of each patch at B/32
# disappears. If tampered recovers here and not under FARE, patch size is
# the mechanism; if it recovers in both, it was never robustness.
#
# Part of the 2x2 that separates PATCH SIZE from ROBUSTNESS:
#
#            standard                    FARE4 (adv. fine-tuned, eps=4/255)
#   B/32     clip_vit_b32_probe          clip_vit_b32_fare_probe
#   B/16     clip_vit_b16_probe          clip_vit_b16_fare_probe
#
# Both B/16 arms share the laion2B-s34B-b88K base, and both B/32 arms share
# laion2B-s34B-b79K, so each column is a controlled comparison. Without the
# standard B/16 arm, any B/16 result confounds the finer patch grid with the
# robustification -- which is the whole question.
#
# REQUIRED: datamodule `normalization_layer: null` (the encoder normalizes
# internally). Read the per-modality rows, not mean accuracy.
