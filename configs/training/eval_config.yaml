defaults:
  - datamodule: sid_set
  - model: resnet18
  - loss: ce
  - trainer: standard
  - uncertainty_score: multiclass_max_probability
  - _self_

dataloaders:
    batch_size: 16
    num_workers: 8

experiment:
  name: ???
  seed: 1

wrapper: base  # base | mc_dropout
num_samples: 20  # number of stochastic forward passes, used when wrapper: mc_dropout

# Evaluation condition, reported beside clean. Add exactly ONE of:
#   +attack=fgsm|pgd|autoattack|ace|param_ace|evidence_pgd|...
#   +corruption=jpeg|webp|downscale|gaussian_noise|gaussian_blur
# They are mutually exclusive -- both set is an error, not a merge. An
# attack is a worst-case, eps-bounded perturbation; a corruption is a
# distributional-shift condition with no budget at all, so the two are
# separate columns of the benchmark and must never be averaged. One run per
# condition: the condition's name keys its metrics and its log directory.

# Temperature scaling: fit a single T on the calib split (NLL-minimising) and
# freeze it before scoring, as a calibration baseline. Reported ECE/NLL/Brier
# reflect the fitted T. Set false to report the raw model (T = 1.0).
calibrate: true

# WP4 selective moderation: fit two thresholds on p(fake) on the clean calib
# split (minimise review rate s.t. residual risk <= SLA), freeze, and report
# coverage / review rate / residual risk / missed-fake / false-flag per
# condition. An uncertainty gate reviews the most-uncertain review_budget
# fraction of clean items. real_class is SID-Set label 0 (real).
moderate: true
moderation_sla: 0.05
# Optional second, asymmetric SLA: cap the share of fakes the policy
# auto-ALLOWS. Residual risk counts both error directions, so a policy can
# satisfy moderation_sla while quietly letting most fakes through -- for a
# deepfake queue that is the error that matters. null = no missed-fake
# commitment (the thresholds are then chosen on residual risk alone).
moderation_sla_missed_fake: null
moderation_review_budget: 0.10
real_class: 0

step: test
output_dir: ${oc.env:OUTPUT_PATH}/${experiment.name}/${model.name}/s${experiment.seed}

hydra:
  run:
    dir: ${oc.env:LOGS_PATH}/${experiment.name}/${model.name}/s${experiment.seed}/${step}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:LOGS_PATH}/${experiment.name}/${model.name}/s${experiment.seed}/${step}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  verbose: false

