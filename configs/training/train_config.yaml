defaults:
  - datamodule: sid_set
  - model: resnet18
  - loss: ce
  - optimizer: adam
  - scheduler: multistep_lr
  - trainer: standard
  - uncertainty_score: multiclass_max_probability
  - callbacks:
    - early_stopping
    - model_checkpoint
  - _self_

dataloaders:
    batch_size: 16
    num_workers: 8
    fold_idx: 1

experiment:
  name: ???
  seed: 1
  training_pipe: standard

wrapper: base  # base | mc_dropout | evidential | depth
num_samples: 20  # number of stochastic forward passes, used when wrapper: mc_dropout

# Evidential Adversarial Training (EV-AT), used when
# experiment.training_pipe: evidential_adversarial (with wrapper: evidential,
# loss: evidential, uncertainty_score: evidential_predictive_entropy).
beta: 1.0        # weight of the robust evidence-alignment loss L_REA
rea_mode: ikl    # discrepancy for the adversary and L_REA: ikl | kl | l2
ikl_ema: 0.9     # EMA rate of the IKL class-wise global weight (a running
                 # mean of the per-class predictive means). On a short run
                 # that buffer never converges, so this is a live knob, not a
                 # constant: a high rate leaves the weight partly at its
                 # uniform initialisation.
adv_eps: 0.03137 # L_inf budget of the adversary (8/255); shared by EV-AT and AT
adv_steps: 10    # PGD steps of the adversary

# Adversarial-training arms (experiment.training_pipe: pgd_at | trades |
# at_kl | mart | at_conf). Report at forensic epsilons: an 8/255 ball can
# erase deepfake evidence and collapse training onto a constant output, so
# warm up eps rather than lowering it: 8/255 is pinned so results stay
# comparable to the field, and `adv_warmup_epochs` is the knob for easing
# into it.
adv_warmup_epochs: 0  # ramp eps over the first N epochs (0 = off)
# beta weights a different term in each arm, so each gets its own key: one
# shared value would make three incomparable settings look like one.
trades_beta: 6.0      # TRADES: KL against natural CE
at_kl_beta: 6.0       # AT+KL: consistency KL against ADVERSARIAL CE
mart_beta: 6.0        # MART: misclassification-weighted KL

# Confidence-axis defence (experiment.training_pipe: conf_reg). Weight of the
# penalty on confident mistakes. 0 reduces the arm to standard training, which
# is the control it has to be read against.
lambda_reg: 1.0

# Track C -- auxiliary depth regularisation (experiment.training_pipe:
# standard_depth | pgd_at_depth | trades_depth, with model=resnet18_depth and
# datamodule.datamodule.depth_targets_dir pointing at a store written by
# src/precompute_depth.py). Weight of the scale-and-shift-invariant depth
# term: L = CE + depth_lambda * L_depth. Read by the depth arms only; a depth
# arm refuses 0 (that is the parent arm with extra parameters, and would read
# as a null result). Sweep ~0.1-1.
depth_lambda: 1.0

# Adversarial Weight Perturbation (Wu et al. 2020). A modifier, not a method:
# it composes with every arm except `standard`, and is reported as an ablation
# ON TOP of an arm rather than as an arm of its own. 0 disables it;
# 0.005-0.01 is the usual range.
awp_gamma: 0.0
awp_warmup_epochs: 0

# Robust model selection. Selecting a defence arm on clean macro-F1 selects it
# on exactly what it deliberately trades away, so the checkpoint kept is the
# least robust epoch that happened to fit the clean split best. Set this > 0
# to also compute `val_robust_accuracy` (one PGD run per validation batch),
# then set selection_metric: val_robust_accuracy so the callbacks use it.
# Available on EVERY pipe, so arms and baselines can be selected alike.
robust_val_steps: 0
# L_inf budget of that validation attack. null falls back to the arm's own
# adv_eps. Deliberately NOT the warm-up ramp: a metric whose attack
# strengthens each epoch is not comparable across the epochs it is selecting
# between, and a max-mode checkpoint would just keep the first one.
robust_val_eps: null

# What the checkpoint and early-stopping callbacks monitor, and in which
# direction. selection_mode MUST match the metric: val_f1_score and
# val_robust_accuracy are max, val_aurc / val_augrc / val_eaurc / val_loss
# are min. Getting it wrong keeps the worst epoch and says nothing.
selection_metric: val_f1_score
selection_mode: max

step: fit
output_dir: ${oc.env:OUTPUT_PATH}/${experiment.name}/${model.name}/s${experiment.seed}

hydra:
  run:
    dir: ${oc.env:LOGS_PATH}/${experiment.name}/${model.name}/s${experiment.seed}/${step}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:LOGS_PATH}/${experiment.name}/${model.name}/s${experiment.seed}/${step}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  verbose: false


# Resume `trainer.fit` from `last.ckpt` if one exists under this experiment's
# output directory. On by default: a full-dataset adversarial arm is 13+ hours
# on a single card, and an interruption at hour 12 should cost one epoch, not
# the run. Set false to force a fresh start, or set ckpt_path to resume a
# specific checkpoint instead of the newest.
resume: true
ckpt_path: null
