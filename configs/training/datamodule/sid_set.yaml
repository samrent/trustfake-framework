datamodule:
  _target_: trustfake.data.SIDSetDataModule
  _partial_: true
  # Directory holding the SID_Set parquet shards (train-*.parquet /
  # validation-*.parquet, searched recursively). See jobs/download_sidset.sh.
  data_dir: ${oc.env:DATA_PATH}/sid_set
  # Shard-level split profile: smoke | full | train | train_holdout
  # (see trustfake.data.manifest.PROFILES).
  profile: full
  # Manifest seed for the shard-to-role assignment. A project constant --
  # deliberately NOT ${experiment.seed}: the reported split must never move
  # with the training seed.
  manifest_seed: 0
  # Fraction of fit carved out (row level) as the model-selection slice.
  val_fraction: 0.05
  batch_size: ${dataloaders.batch_size}
  num_workers: ${dataloaders.num_workers}
  image_size: 224
  seed: ${experiment.seed}
  pin_memory: true
  # GEOMETRY CONTROL (a) -- row filter: none | square | nonsquare | matched
  # (see trustfake.data.manifest.geometry_selection). SID-Set is
  # squares-are-fake biased: 'width == height -> fake' scores ~0.98, above a
  # CLIP probe. Anything but 'none' restricts the calib/test/holdout rows to
  # a subset where that rule carries no label information -- and changes
  # what the reported number means, so it belongs in the report. 'matched'
  # also equalises the class prior, which moves the majority-class floor.
  geometry_filter: none
  # GEOMETRY CONTROL (b) -- centre-crop every image to its short side BEFORE
  # the resize to image_size. Load-bearing order: after the resize every
  # image is already square, so a crop there would be a silent no-op. Fit
  # AND evaluate with the same setting or it is a covariate shift, not a
  # control. Neither control removes the 'short side == 1024' residue.
  squarecrop: false
  # Optional normalization layer applied to inputs before the model forward
  # pass. Defaults to no-op (nn.Identity) when left null. Uncomment to enable
  # ImageNet normalization, for example:
  normalization_layer:
    _target_: torchvision.transforms.Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  # normalization_layer: null
