attack:
  _target_: trustfake.attacks.AdaptiveAutoAttack
  eps: 0.03137
  # Inner iterations PER SAMPLE across all rounds -- a total cost of
  # steps * batch sample-iterations. Online Statistics-based Discarding
  # redistributes that total onto the still-unsolved samples (a round on a
  # quarter of the batch runs roughly four times as many iterations at the
  # same cost); it does not add to it.
  steps: 100
  # Adaptive Direction Initialization rounds. Each re-initialises the
  # unsolved samples, from round 2 on including directions that already
  # worked on other samples in the batch.
  rounds: 3
  n_random_init: 6
  momentum: 0.75
  seed: 0
  clip_min: 0.0
  clip_max: 1.0
