# Isotropic Gaussian blur: the opposite failure mode to gaussian_noise --
# it REMOVES the high-frequency residue a real detector depends on.
# Metric prefix / log dir: gaussian_blur_sigma<sigma>.
corruption:
  _target_: trustfake.corruptions.GaussianBlur
  # Standard deviation in pixels of the 224x224 model input grid, not of
  # the original image (corruptions are applied post-resize).
  sigma: 1.0
  clip_min: 0.0
  clip_max: 1.0
